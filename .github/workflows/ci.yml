name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # matrix 收窄 [24]:CI Linux 上 vitest 4.1.x vi.mock 内置模块跨文件隔离失效(平台敏感,
        # 版本无关——本地 Windows 4.1.7/4.1.9 双版本全量 2852 全过为铁证)。已合并 game-bridge
        # 两测试文件规避 net mock 跨文件碰撞(test/game-bridge.test.ts)。engines>=18 声明不变。
        # B 验证绿后可恢复 [22, 24]。详见 PR #14 调查。
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Check rules version bump（spec §4 不变式）
        run: node scripts/check-rules-version-bump.mjs
      - run: npx vitest run --coverage
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # 第3项-B: 用真实 Godot 跑 E2E,避免 describe.skipIf(!hasGodot) 静默跳过导致的"全绿幻觉"
  e2e-godot:
    name: E2E (real Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Godot 4.6.3 (linux x86_64)
        run: |
          set -e
          curl -L --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-bin
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_PATH=/tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run E2E (real Godot integration)
        run: npx vitest run test/e2e-full-tool-verification.test.ts
