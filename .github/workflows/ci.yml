name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24]  # Node 22 在 Linux 未验证,保守单版本;engines>=18 声明不变
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Check rules version bump（spec §4 不变式）
        run: node scripts/check-rules-version-bump.mjs
      # Linux 测试 gate:排除 game-bridge.test.ts。该文件 vi.mock('net') 在 Linux 稳定失效
      # (issue #15:单文件 113/120/138 行同败 → 非全量隔离,vitest 配置无救),平台敏感(Windows 23/23 过)。
      # game-bridge.ts 覆盖退本地(vitest.config coverage.exclude)。详见 issue #15
      - run: npx vitest run --exclude test/game-bridge.test.ts --coverage
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # C 聚焦尝试(issue #15):Windows 去掉 --coverage,验证 libuv fs-event.c abort 是否由 coverage-v8 的 fs.watch 触发。
  # 跑完(绿) → coverage-v8 是元凶 → Windows gate 升级(去 coverage,T-2/process-state 守护回归);还崩(红) → 撤回转 A。
  windows-check:
    name: check (Windows, no-coverage probe)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build  # 测试依赖 build/ 产物(如 test/helpers/tool-context.js:5 import build/helpers.js)
      - run: npx vitest run  # 去 --coverage:排除 coverage-v8 fs.watch 触发 libuv abort 的可能

  # 第3项-B: 用真实 Godot 跑 E2E,避免 describe.skipIf(!hasGodot) 静默跳过导致的"全绿幻觉"
  e2e-godot:
    name: E2E (real Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Godot 4.6.3 (linux x86_64)
        run: |
          set -e
          curl -L --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-bin
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_PATH=/tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run E2E (real Godot integration)
        run: npx vitest run test/e2e-full-tool-verification.test.ts
